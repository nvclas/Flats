name: Build and Release

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_version: ${{ steps.extract_version.outputs.tag_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract versions
        id: extract_version
        run: |
          CORE_VER=$(./gradlew :flats-core:properties --console=plain -q | grep "^version:" | awk '{print $2}')
          LITE_VER=$(./gradlew :flats-lite:properties --console=plain -q | grep "^version:" | awk '{print $2}')
          echo "tag_version=${CORE_VER}-${LITE_VER}" >> $GITHUB_OUTPUT

      - name: Build with Gradle
        run: ./gradlew :flats-lite:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: flats-lite/build/libs/Flats_*.jar

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts
          path: release-libs/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.tag_version }}
          name: Flats v${{ needs.build.outputs.tag_version }}
          body: ${{ github.event.head_commit.message }}
          draft: true
          prerelease: false
          files: release-libs/Flats_*.jar
